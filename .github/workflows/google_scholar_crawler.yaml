name: Update Google Scholar Citations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "google_scholar_crawler/**"
      - ".github/workflows/google_scholar_crawler.yaml"
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        env:
          GOOGLE_SCHOLAR_ID: FVJO7aAAAAAJ
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python google_scholar_crawler/main.py

      - name: Publish citation JSON branch
        run: |
          cd google_scholar_crawler/results
          git init
          git checkout -b google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Update Google Scholar citation data"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
