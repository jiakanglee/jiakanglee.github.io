name: Update Google Scholar Citations

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out crawler
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the published snapshot
        uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: stats

      - name: Fetch citation data from SerpApi
        timeout-minutes: 2
        env:
          GOOGLE_SCHOLAR_ID: FVJO7aAAAAAJ
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_STATS_DIR: stats
        run: python3 -u google_scholar_crawler/main.py

      - name: Publish verified citation data
        working-directory: stats
        run: |
          git add -- gs_data.json gs_data_shieldsio.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Google Scholar citation data"
            git push origin HEAD:refs/heads/google-scholar-stats
          fi
